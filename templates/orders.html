<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>주문내역 - DeliveryApp</title>
</head>

<body>

    <h1>주문(절약)내역</h1>

    {% if orders %}

    {% for order in orders %}

    <div>
        <h2>주문번호 #{{ order[0] }}</h2>

        <p>주문 날짜: {{ order[1] }}</p>

        <p>
            절약한 금액:
            {{ "{:,}".format(order[2]) }}원
        </p>

        <p>
            절약한 칼로리:
            {{ "{:,}".format(order[3]) }} kcal
        </p>

        <a href="/orders/{{ order[0] }}">
            주문 상세보기
        </a>

        <hr>
    </div>

    {% endfor %}

    {% else %}

    <p>아직 주문(절약)내역이 없습니다.</p>
    <a href="/">음식점 보러가기</a>

    {% endif %}

    <p>
        <a href="/">← 홈으로</a>
    </p>

</body>

</html>
