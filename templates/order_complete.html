<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>주문 완료 - DeliveryApp</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            text-align: center;
        }

        .complete {
            background-color: white;
            margin: 80px 20px;
            padding: 40px 20px;
            border-radius: 20px;
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            margin-top: 20px;
        }

        .message {
            color: #777;
        }

        .saving {
            margin-top: 30px;
            padding: 20px;
            background-color: #f7f7f7;
            border-radius: 15px;
        }

        .home-button {
            display: block;
            margin-top: 20px;
            padding: 15px;
            background-color: black;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <main class="complete">

        <div class="icon">✅</div>

        <h1>주문이 완료되었습니다!</h1>

        <p class="message">
            실제 결제 없이 주문이 완료되었습니다.
        </p>

        <div class="saving">

            <h2>절약 성공!</h2>

            <p>
                이번 주문으로
                <strong>{{ "{:,}".format(saved_price) }}원</strong>을
                절약했습니다!
            </p>

            <p>
                <strong>{{ "{:,}".format(saved_calories) }} kcal</strong>의
                섭취를 줄였습니다!
            </p>

            <p>
                <a href="/orders">주문내역 확인하기</a>
            </p>

            <p>
                <a href="/saving">전체 절약 통계 보기</a>
            </p>

        </div>

        <a href="/" class="home-button">
            홈으로 돌아가기
        </a>

    </main>

</body>

</html>
