<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>절약 통계 - DeliveryApp</title>
</head>

<body>

    <h1>절약 통계</h1>

    {% if saving_data[0] > 0 %}

    <h2>📦 총 가상 주문</h2>
    <p>{{ saving_data[0] }}회</p>

    <h2>💰 총 절약 금액</h2>
    <p>{{ "{:,}".format(saving_data[1]) }}원</p>

    <h2>🔥 총 절약 칼로리</h2>
    <p>{{ "{:,}".format(saving_data[2]) }} kcal</p>

    <a href="/orders">주문(절약)내역 보기</a>

    {% else %}

    <p>아직 절약 기록이 없습니다.</p>
    <p>가상 주문을 하면 절약한 금액과 칼로리가 기록됩니다.</p>

    <a href="/">음식점 보러가기</a>

    {% endif %}

    <p>
        <a href="/">← 홈으로</a>
    </p>

</body>

</html>
