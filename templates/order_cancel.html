{% if order[5] == 'cancelled' %}
<p class="order-meta">주문 상태: 취소됨</p>
{% if order[6] %}<p>취소 일시: {{ order[6] }}</p>{% endif %}
{% elif order[5] == 'active' %}
<p class="sr-only">주문 상태: 정상</p>
{% else %}
<p>주문 상태: 확인 불가</p>
{% endif %}
{% if order[0] in cancellable %}
<form method="post" action="{{ url_for('cancel_order', order_id=order[0]) }}" data-cancel-remaining="{{ cancel_remaining[order[0]] }}"
      onsubmit="return confirm('이 주문을 취소하시겠습니까?');">
    <input type="hidden" name="cancel_token" value="{{ cancel_token }}">
    <button class="app-button button-secondary" type="submit" title="주문 접수 단계에서만 취소할 수 있습니다.">주문 취소</button>
</form>
{% endif %}
