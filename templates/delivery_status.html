<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>배달현황 - DeliveryApp</title>
</head>

<body>

    <h1>가상 배달현황</h1>

    <p>주문번호: #{{ order[0] }}</p>
    <p>주문시간: {{ order[1] }}</p>
    <p>배달 주소: {{ order[2] }}</p>

    <hr>

    <h2 id="delivery-status">배달 상태 확인 중...</h2>
    <p id="delivery-message"></p>

    <hr>

    <h2>배달 위치 및 음식점 위치</h2>
    <p>지도에서 핀을 클릭하면 위치 정보를 확인할 수 있습니다.</p>

    <div id="map" style="width:100%; height:400px;"></div>
    <h3>음식점별 배달 거리</h3>
    <p>※ 실제 도로 이동거리가 아닌 좌표 기준 직선거리입니다.</p>
    <ul id="distance-list">
        <li>거리 계산 중...</li>
    </ul>

    <script type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_javascript_key }}&libraries=services">
        </script>

    <script>
        const deliveryAddress = {{ order[2] | tojson }};
        const restaurants = {{ restaurants | tojson }};

        const mapContainer = document.getElementById("map");

        const map = new kakao.maps.Map(mapContainer, {
            center: new kakao.maps.LatLng(37.4506, 126.6570),
            level: 3
        });

        const geocoder = new kakao.maps.services.Geocoder();
        const bounds = new kakao.maps.LatLngBounds();

        let successCount = 0;
        let completedCount = 0;
        const totalCount = restaurants.length + 1;

        let deliveryCoords = null;
        const restaurantCoords = [];

        function calculateDistance(start, end) {
            const R = 6371;

            const lat1 = start.getLat() * Math.PI / 180;
            const lat2 = end.getLat() * Math.PI / 180;
            const dLat = (end.getLat() - start.getLat()) * Math.PI / 180;
            const dLon = (end.getLng() - start.getLng()) * Math.PI / 180;

            const a =
                Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1) * Math.cos(lat2) *
                Math.sin(dLon / 2) ** 2;

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        function displayDistances() {
            const distanceList = document.getElementById("distance-list");
            distanceList.innerHTML = "";

            if (!deliveryCoords) {
                const item = document.createElement("li");
                item.textContent = "배달 주소 좌표를 확인할 수 없습니다.";
                distanceList.appendChild(item);
                return;
            }

            if (restaurantCoords.length === 0) {
                const item = document.createElement("li");
                item.textContent = "주소가 등록된 음식점이 없습니다.";
                distanceList.appendChild(item);
                return;
            }

            const MAX_DELIVERY_DISTANCE = 5;

            restaurantCoords.forEach(function (restaurant) {
                const distance = calculateDistance(
                    restaurant.coords,
                    deliveryCoords
                );

                const isDeliverable = distance <= MAX_DELIVERY_DISTANCE;

                const deliveryStatus = isDeliverable
                    ? "가상 배달 가능"
                    : "가상 배달 범위 초과";

                const item = document.createElement("li");

                item.textContent =
                    restaurant.name + " → " +
                    distance.toFixed(2) + "km / " +
                    deliveryStatus;

                distanceList.appendChild(item);
            });
        }

        function searchCompleted() {
            completedCount++;

            if (completedCount === totalCount) {
                if (successCount > 0) {
                    map.setBounds(bounds);
                }

                displayDistances();
            }
        }

        geocoder.addressSearch(deliveryAddress, function (result, status) {
            if (status === kakao.maps.services.Status.OK) {
                const coords = new kakao.maps.LatLng(result[0].y, result[0].x);

                deliveryCoords = coords;

                const marker = new kakao.maps.Marker({
                    map: map,
                    position: coords
                });

                const infoWindow = new kakao.maps.InfoWindow({
                    content: '<div style="padding:5px;">배달 주소</div>'
                });

                kakao.maps.event.addListener(marker, "click", function () {
                    infoWindow.open(map, marker);
                });

                bounds.extend(coords);
                successCount++;
            }

            searchCompleted();
        });

        restaurants.forEach(function (restaurant) {
            const restaurantName = restaurant[0];
            const restaurantAddress = restaurant[1];

            geocoder.addressSearch(restaurantAddress, function (result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const coords = new kakao.maps.LatLng(result[0].y, result[0].x);

                    restaurantCoords.push({
                        name: restaurantName,
                        coords: coords
                    });

                    const marker = new kakao.maps.Marker({
                        map: map,
                        position: coords
                    });

                    const nameElement = document.createElement("div");
                    nameElement.style.padding = "5px";
                    nameElement.textContent = restaurantName;

                    const infoWindow = new kakao.maps.InfoWindow({
                        content: nameElement
                    });

                    kakao.maps.event.addListener(marker, "click", function () {
                        infoWindow.open(map, marker);
                    });

                    bounds.extend(coords);
                    successCount++;
                }

                searchCompleted();
            });
        });
    </script>

    <hr>

    <a href="/orders/{{ order[0] }}">주문 상세보기</a>
    <a href="/orders">주문내역</a>

    <script>
        const orderTime = new Date("{{ order[1].strftime('%Y-%m-%dT%H:%M:%S') }}");

        function updateDeliveryStatus() {
            const now = new Date();
            const elapsedSeconds = Math.floor((now - orderTime) / 1000);

            const statusElement = document.getElementById("delivery-status");
            const messageElement = document.getElementById("delivery-message");

            if (elapsedSeconds < 20) {
                statusElement.innerText = "주문 접수";
                messageElement.innerText = "음식점에서 주문을 확인하고 있습니다.";
            } else if (elapsedSeconds < 40) {
                statusElement.innerText = "음식 준비중";
                messageElement.innerText = "음식점에서 음식을 준비하고 있습니다.";
            } else if (elapsedSeconds < 60) {
                statusElement.innerText = "배달기사 배정";
                messageElement.innerText = "배달기사가 음식점으로 이동하고 있습니다.";
            } else if (elapsedSeconds < 80) {
                statusElement.innerText = "배달중";
                messageElement.innerText = "배달기사가 배달 주소로 이동하고 있습니다.";
            } else {
                statusElement.innerText = "가상 배달 완료";
                messageElement.innerText = "가상 배달이 완료되었습니다.";
            }
        }

        updateDeliveryStatus();
        setInterval(updateDeliveryStatus, 1000);
    </script>

</body>

</html>
