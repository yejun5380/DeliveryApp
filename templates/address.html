<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>배달 주소 - DeliveryApp</title>
</head>

<body>

    <h1>배달 주소 설정</h1>

    <form method="POST">
        <label>배달 주소</label>

        <input type="text" name="address" value="{{ current_address or '' }}" placeholder="배달 받을 주소를 입력하세요" required>

        <button type="submit">주소 저장</button>
    </form>

    {% if current_address %}
    <p>현재 배달 주소: {{ current_address }}</p>
    {% else %}
    <p>아직 등록된 배달 주소가 없습니다.</p>
    {% endif %}

    <p>
        <a href="/">← 홈으로</a>
    </p>

    {% if nickname %}
    <span>{{ nickname }}님</span>

    <a href="/cart">🛒 장바구니</a>
    <a href="/address">배달 주소 설정</a>
    <a href="/orders">주문내역</a>
    <a href="/saving">절약 통계</a>
    <a href="/logout">로그아웃</a>
    {% else %}
    <a href="/login">로그인</a>
    <a href="/signup">회원가입</a>
    {% endif %}

</body>

</html>
