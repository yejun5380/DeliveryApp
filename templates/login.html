{% extends 'app_shell.html' %}
{% block title %}로그인 - DeliveryApp{% endblock %}
{% block content %}
<section class="app-card account-panel">
    <p class="eyebrow">DeliveryApp</p><h1>로그인</h1><p class="section-description">다시 만나 반가워요. 가상 주문과 절약 기록을 이어가세요.</p>

    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form class="account-form" action="/login" method="POST">

        <label for="username">아이디</label><input id="username" type="text" name="username" value="{{ username or '' }}" autocomplete="username" placeholder="아이디" required>

        <label for="password">비밀번호</label><input id="password" type="password" name="password" autocomplete="current-password" placeholder="비밀번호" required>

        <button class="app-button" type="submit">로그인</button>

    </form>

    <p class="account-switch">처음이신가요? <a href="/signup">회원가입</a></p>


</section>
{% endblock %}
