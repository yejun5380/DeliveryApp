<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DeliveryApp 프로젝트 소개</title>
</head>
<body>

    <h1>DeliveryApp</h1>

    <h2>프로젝트 소개</h2>

    <p>
        배달앱을 기반으로 한 가상 주문 웹 서비스를 제작합니다.
    </p>

    <p>
        실제 결제나 배달은 하지 않고,
        음식점을 선택하고 메뉴를 주문하는 과정을 웹으로 구현합니다.
    </p>

    <h2>주요 기능</h2>

    <ul>
        <li>회원가입 및 로그인</li>
        <li>음식점 목록 및 상세 정보 확인</li>
        <li>음식점별 메뉴 확인</li>
        <li>장바구니</li>
        <li>가상 주문</li>
        <li>주문 내역 확인</li>
        <li>누적 절약 금액 및 칼로리 확인</li>
    </ul>

</body>
</html>
